<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morais Barber - Barbearia Premium em Canudos</title>
    <meta name="description" content="Morais Barber - Barbearia clássica e tattoo em Canudos. Cortes modernos, barba feita com capricho e um ambiente pensado pra você." />
    <meta property="og:title" content="Morais Barber" />
    <meta property="og:description" content="Onde estilo encontra excelência" />
    <meta property="og:type" content="website" />
    <style>
      /* Tela de carregamento/erro — se o JS morrer, o usuário vê o que houve */
      #fallback-boot { position: fixed; inset: 0; background: #0a0a0a; color: #d4a853; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; gap: 12px; padding: 24px; text-align: center; z-index: 9999; }
      #fallback-boot .logo { font-size: 1.8rem; font-weight: 700; letter-spacing: 2px; }
      #fallback-boot .msg { color: #ccc; font-size: 0.95rem; max-width: 420px; }
      #fallback-boot .erro { color: #ff6b6b; font-size: 0.85rem; max-width: 520px; word-break: break-word; }
      #fallback-boot .btn { background: #d4a853; color: #0a0a0a; border: none; border-radius: 8px; padding: 10px 22px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback-boot">
      <div class="logo">MORAIS BARBER</div>
      <div class="msg" id="boot-msg">Carregando...</div>
      <button class="btn" id="boot-btn" onclick="location.reload()" style="display:none">Tentar de novo</button>
      <div class="erro" id="boot-erro"></div>
    </div>
    <script>
      // Se em 6s o React não montou, mostra ajuda em vez de tela preta
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || !root.innerHTML || root.innerHTML === '') {
          var msg = document.getElementById('boot-msg')
          if (msg) {
            msg.textContent = 'O site não conseguiu carregar neste navegador. Limpe o cache (Ctrl+Shift+R) ou atualize o navegador.'
          }
          var btn = document.getElementById('boot-btn')
          if (btn) btn.style.display = 'block'
        } else {
          var fb = document.getElementById('fallback-boot')
          if (fb) fb.remove()
        }
      }, 6000)
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root')
        if (root && (!root.innerHTML || root.innerHTML === '')) {
          var msg = document.getElementById('boot-msg')
          var erro = document.getElementById('boot-erro')
          if (msg) msg.textContent = 'Erro ao carregar o site:'
          if (erro) erro.textContent = (e.message || 'Erro desconhecido') + ' — tente Ctrl+Shift+R'
        }
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
